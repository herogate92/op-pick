name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily 06:17 KST (21:17 UTC). GitHub may delay scheduled runs.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:rates:test
      - run: npm run test:recommendations
      - name: Refresh statistics before deployment
        id: refresh
        run: npm run data:rates
      - name: Report statistics refresh failure
        if: ${{ failure() && steps.refresh.outcome == 'failure' }}
        run: |
          echo "::error title=Statistics refresh failed::New statistics were not published. The previous successful site deployment remains available."
          echo "### Statistics refresh failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The previous successful deployment is retained. Inspect the refresh step; retry with workflow_dispatch after recovery." >> "$GITHUB_STEP_SUMMARY"
      - run: npm run data:validate
      - run: npm run videos:validate
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
