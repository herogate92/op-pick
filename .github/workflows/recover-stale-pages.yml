name: Recover timed-out Pages deployment
on:
  push:
    branches: [ops/recover-stale-pages]
    paths: [.github/workflows/recover-stale-pages.yml]
permissions:
  pages: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel known timed-out deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/herogate92/op-pick/pages/deployments/f1d3dd57046432c3e5f7061b6b48e80da81bae1d/cancel
